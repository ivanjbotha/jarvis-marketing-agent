<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S - Mission Control</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0a0f1e 0%, #1a1f2e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* HEADER */
        .header {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 3px;
            color: #00ffff;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
            margin-bottom: 5px;
        }

        .header p {
            font-size: 12px;
            letter-spacing: 2px;
            color: #00ffff;
            opacity: 0.6;
            text-transform: uppercase;
        }

        /* MAIN LAYOUT */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 30px;
            flex: 1;
        }

        /* LEFT PANEL */
        .left-panel {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 8px;
            padding: 20px;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .panel-title {
            font-size: 12px;
            font-weight: 600;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
            margin-bottom: 10px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(0, 255, 255, 0.1);
            font-size: 12px;
        }

        .stat-label {
            color: #888;
        }

        .stat-value {
            color: #00ffff;
            font-weight: 600;
        }

        /* CENTER - VOICE VISUALIZER */
        .center-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
        }

        .visualizer-container {
            position: relative;
            width: 320px;
            height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #voiceCanvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        .center-button {
            position: absolute;
            width: 120px;
            height: 120px;
            border: 2px solid #00ffff;
            border-radius: 50%;
            background: rgba(0, 255, 255, 0.05);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
            transition: all 0.3s ease;
            z-index: 10;
        }

        .center-button:hover {
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.5);
            transform: scale(1.05);
        }

        .center-button.listening {
            border-color: #ff4444;
            background: rgba(255, 68, 68, 0.1);
            box-shadow: 0 0 50px rgba(255, 68, 68, 0.5);
        }

        .status-text {
            font-size: 12px;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }

        /* RIGHT PANEL - CONVERSATION */
        .right-panel {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 8px;
            padding: 20px;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 600px;
        }

        .conversation {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            padding: 12px;
            border-radius: 6px;
            font-size: 12px;
            line-height: 1.5;
            max-width: 100%;
            word-wrap: break-word;
        }

        .message.user {
            background: rgba(0, 255, 255, 0.1);
            border-left: 3px solid #00ffff;
            color: #00ffff;
            align-self: flex-end;
            max-width: 90%;
        }

        .message.jarvis {
            background: rgba(0, 200, 255, 0.05);
            border-left: 3px solid #0088ff;
            color: #88ddff;
            align-self: flex-start;
            max-width: 90%;
        }

        .message.system {
            background: rgba(255, 170, 0, 0.05);
            border-left: 3px solid #ffaa00;
            color: #ffaa00;
            font-size: 11px;
            text-align: center;
            align-self: center;
            max-width: 80%;
        }

        /* SCROLLBAR */
        .conversation::-webkit-scrollbar {
            width: 6px;
        }

        .conversation::-webkit-scrollbar-track {
            background: rgba(0, 255, 255, 0.05);
        }

        .conversation::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 255, 0.3);
            border-radius: 3px;
        }

        /* SETTINGS */
        .settings {
            margin-top: 30px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 8px;
            padding: 20px;
        }

        .settings-title {
            font-size: 12px;
            font-weight: 600;
            color: #00ffff;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .setting-group {
            margin-bottom: 15px;
        }

        .setting-group label {
            display: block;
            font-size: 10px;
            color: #888;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .setting-group input,
        .setting-group select {
            width: 100%;
            padding: 8px 10px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 4px;
            color: #00ffff;
            font-size: 12px;
        }

        .setting-group input:focus,
        .setting-group select:focus {
            outline: none;
            border-color: #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
        }

        /* RESPONSIVE */
        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <h1>J.A.R.V.I.S</h1>
            <p>Mission Control Dashboard</p>
        </div>

        <!-- MAIN GRID -->
        <div class="main-grid">
            <!-- LEFT PANEL -->
            <div class="left-panel">
                <div class="panel-title">System Status</div>
                <div class="stat-item">
                    <span class="stat-label">Status</span>
                    <span class="stat-value">● Online</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">CPU Usage</span>
                    <span class="stat-value">34%</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Memory</span>
                    <span class="stat-value">2.4 GB</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Uptime</span>
                    <span class="stat-value">8h 47m</span>
                </div>

                <div style="border-top: 1px solid rgba(0, 255, 255, 0.1); margin-top: 15px; padding-top: 15px;">
                    <div class="panel-title">Agents</div>
                    <div class="stat-item">
                        <span class="stat-label">Research</span>
                        <span class="stat-value">● Active</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Writing</span>
                        <span class="stat-value">● Active</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Approval</span>
                        <span class="stat-value">○ Idle</span>
                    </div>
                </div>
            </div>

            <!-- CENTER PANEL -->
            <div class="center-panel">
                <div class="visualizer-container">
                    <canvas id="voiceCanvas"></canvas>
                    <button class="center-button" id="centerButton">🎤</button>
                </div>
                <div class="status-text" id="statusText">Click to speak</div>
            </div>

            <!-- RIGHT PANEL - CONVERSATION -->
            <div class="right-panel">
                <div class="panel-title">Conversation</div>
                <div class="conversation" id="conversation"></div>
            </div>
        </div>

        <!-- SETTINGS -->
        <div class="settings">
            <div class="settings-title">Configuration</div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="setting-group">
                    <label>Claude API Key</label>
                    <input type="password" id="apiKey" placeholder="sk-...">
                </div>
                <div class="setting-group">
                    <label>Business Niche</label>
                    <input type="text" id="linkedinNiche" placeholder="Your niche" value="Leadership Development, Coaching, AI for Managers">
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        const synth = window.speechSynthesis;

        const googleCloudApiKey = 'AIzaSyB8M5fROsWmdBD51j5Xe2Mg5e5HDwqhUZ8';

        let isListening = false;
        let isSpeaking = false;

        // Canvas setup
        const canvas = document.getElementById('voiceCanvas');
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        let wavePhase = 0;
        const waveFrequency = 0.05;
        const waveAmplitude = 10;

        function drawWaves() {
            const centerX = canvas.width / (2 * window.devicePixelRatio);
            const centerY = canvas.height / (2 * window.devicePixelRatio);
            const baseRadius = 40;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw multiple wave rings
            for (let ring = 0; ring < 5; ring++) {
                const points = [];
                const radius = baseRadius + ring * 25;
                const segments = 180;

                for (let i = 0; i <= segments; i++) {
                    const angle = (i / segments) * Math.PI * 2;
                    const waveOffset = Math.sin(wavePhase + ring * 0.3) * (isSpeaking ? waveAmplitude * 1.5 : waveAmplitude);
                    const r = radius + waveOffset;

                    const x = centerX + Math.cos(angle) * r;
                    const y = centerY + Math.sin(angle) * r;

                    points.push({ x, y });
                }

                // Draw wave line
                ctx.beginPath();
                ctx.moveTo(points[0].x, points[0].y);
                for (let i = 1; i < points.length; i++) {
                    ctx.lineTo(points[i].x, points[i].y);
                }

                const opacity = isSpeaking ? 0.6 - ring * 0.1 : 0.3 - ring * 0.05;
                ctx.strokeStyle = `rgba(0, 255, 255, ${opacity})`;
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            wavePhase += waveFrequency;
            animationFrameId = requestAnimationFrame(drawWaves);
        }

        drawWaves();

        // DOM Elements
        const centerButton = document.getElementById('centerButton');
        const statusText = document.getElementById('statusText');
        const conversation = document.getElementById('conversation');
        const apiKeyInput = document.getElementById('apiKey');
        const nicheInput = document.getElementById('linkedinNiche');

        // Speech Recognition
        recognition.continuous = false;
        recognition.interimResults = true;
        recognition.lang = 'en-US';

        function addMessage(text, type) {
            const msg = document.createElement('div');
            msg.className = `message ${type}`;
            msg.textContent = text;
            conversation.appendChild(msg);
            conversation.scrollTop = conversation.scrollHeight;
        }

        recognition.onstart = () => {
            isListening = true;
            centerButton.classList.add('listening');
            statusText.textContent = 'Listening...';
            addMessage('Listening...', 'system');
        };

        recognition.onresult = (event) => {
            let interimTranscript = '';
            for (let i = event.resultIndex; i < event.results.length; i++) {
                const transcriptSegment = event.results[i][0].transcript;
                if (event.results[i].isFinal) {
                    statusText.textContent = transcriptSegment;
                } else {
                    interimTranscript += transcriptSegment;
                }
            }
            if (interimTranscript) {
                statusText.textContent = interimTranscript;
            }
        };

        recognition.onend = async () => {
            isListening = false;
            centerButton.classList.remove('listening');
            statusText.textContent = 'Processing...';
            const userInput = statusText.textContent;

            if (userInput.trim() && userInput !== 'Processing...') {
                addMessage(userInput, 'user');
                await processUserInput(userInput);
            }
        };

        recognition.onerror = (event) => {
            statusText.textContent = `Error: ${event.error}`;
            centerButton.classList.remove('listening');
            addMessage(`Error: ${event.error}`, 'system');
        };

        centerButton.addEventListener('click', () => {
            if (isListening) {
                recognition.stop();
            } else {
                statusText.textContent = '';
                recognition.start();
            }
        });

        async function speakAsJarvis(text) {
            isSpeaking = true;
            console.log('🎤 Speaking:', text);

            if (googleCloudApiKey) {
                try {
                    const response = await fetch(
                        `https://texttospeech.googleapis.com/v1/text:synthesize?key=${googleCloudApiKey}`,
                        {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                input: { text: text },
                                voice: {
                                    languageCode: 'en-GB',
                                    name: 'en-GB-Neural2-A',
                                },
                                audioConfig: {
                                    audioEncoding: 'MP3',
                                    pitch: -2.0,
                                    speakingRate: 0.85,
                                },
                            }),
                        }
                    );

                    if (response.ok) {
                        const data = await response.json();
                        const audioContent = data.audioContent;
                        const binaryString = atob(audioContent);
                        const bytes = new Uint8Array(binaryString.length);
                        for (let i = 0; i < binaryString.length; i++) {
                            bytes[i] = binaryString.charCodeAt(i);
                        }

                        const audioBlob = new Blob([bytes], { type: 'audio/mpeg' });
                        const audioUrl = URL.createObjectURL(audioBlob);
                        const audio = new Audio(audioUrl);
                        audio.onended = () => { isSpeaking = false; };
                        audio.play();

                        console.log('✓ Playing Google Cloud TTS');
                        return;
                    }
                } catch (error) {
                    console.error('Error:', error.message);
                }
            }

            isSpeaking = false;
        }

        async function processUserInput(input) {
            const apiKey = apiKeyInput.value;

            if (!apiKey) {
                addMessage('API key required', 'system');
                speakAsJarvis('Please configure your Claude API key.');
                statusText.textContent = 'Click to speak';
                return;
            }

            addMessage('Processing...', 'system');
            await new Promise(resolve => setTimeout(resolve, 1500));

            const response = 'I\'ve analyzed your content and prepared posts for review.';
            addMessage(response, 'jarvis');
            speakAsJarvis(response);
            statusText.textContent = 'Click to speak';
        }

        window.addEventListener('load', () => {
            setTimeout(() => {
                addMessage('JARVIS online and ready', 'system');
                speakAsJarvis('Mission control online. Ready to assist.');
            }, 500);
        });
    </script>
</body>
</html>
