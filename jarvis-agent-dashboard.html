<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S - Mission Control</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0a0f1e 0%, #1a1f2e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* HEADER */
        .header {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 3px;
            color: #00ffff;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
            margin-bottom: 5px;
        }

        .header p {
            font-size: 12px;
            letter-spacing: 2px;
            color: #00ffff;
            opacity: 0.6;
            text-transform: uppercase;
        }

        /* MAIN CONTENT - TWO COLUMNS */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            flex: 1;
            align-items: start;
        }

        /* LEFT SIDEBAR */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .panel {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 8px;
            padding: 15px;
            backdrop-filter: blur(10px);
        }

        .panel-title {
            font-size: 12px;
            font-weight: 600;
            color: #00ffff;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(0, 255, 255, 0.1);
            font-size: 12px;
        }

        .stat-item:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: #888;
        }

        .stat-value {
            color: #00ffff;
            font-weight: 600;
        }

        /* CENTER - ANIMATED CIRCLE */
        .center-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .voice-visualizer {
            position: relative;
            width: 280px;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sound-circles {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        .sound-circle {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 50%;
            animation: pulse-out 2s ease-out infinite;
        }

        .sound-circle:nth-child(1) {
            animation-delay: 0s;
        }

        .sound-circle:nth-child(2) {
            animation-delay: 0.4s;
        }

        .sound-circle:nth-child(3) {
            animation-delay: 0.8s;
        }

        @keyframes pulse-out {
            0% {
                transform: scale(0.3);
                opacity: 1;
                border-color: rgba(0, 255, 255, 0.8);
            }
            100% {
                transform: scale(1);
                opacity: 0;
                border-color: rgba(0, 255, 255, 0);
            }
        }

        .center-circle {
            position: relative;
            z-index: 10;
            width: 140px;
            height: 140px;
            border: 2px solid #00ffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            background: rgba(0, 255, 255, 0.1);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3), inset 0 0 30px rgba(0, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .center-circle.listening {
            border-color: #ff4444;
            box-shadow: 0 0 40px rgba(255, 68, 68, 0.5), inset 0 0 30px rgba(255, 68, 68, 0.1);
        }

        .center-circle.speaking {
            border-color: #00ffff;
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.6), inset 0 0 30px rgba(0, 255, 255, 0.2);
        }

        .status-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #00ff88;
            box-shadow: 0 0 10px #00ff88;
        }

        .status-text {
            font-size: 12px;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        /* RIGHT PANEL - FEED/AGENTS */
        .right-panel {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 8px;
            padding: 20px;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 600px;
            overflow-y: auto;
        }

        .activity-line {
            font-size: 11px;
            line-height: 1.6;
            padding: 8px 10px;
            border-left: 2px solid rgba(0, 255, 255, 0.3);
            padding-left: 12px;
            font-family: 'Courier New', monospace;
            color: #00ffff;
        }

        .activity-line.warning {
            color: #ffaa00;
            border-left-color: rgba(255, 170, 0, 0.5);
        }

        .activity-line.error {
            color: #ff4444;
            border-left-color: rgba(255, 68, 68, 0.5);
        }

        .timestamp {
            color: #555;
            font-size: 9px;
        }

        /* AGENT CARDS */
        .agent-cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 10px;
        }

        .agent-card {
            background: rgba(0, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 6px;
            padding: 10px;
            font-size: 11px;
        }

        .agent-card .status {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #00ff88;
            margin-right: 5px;
        }

        .agent-card .name {
            color: #00ffff;
            font-weight: 600;
        }

        .agent-card .task {
            color: #888;
            font-size: 9px;
            margin-top: 3px;
        }

        /* SETTINGS */
        .settings {
            margin-top: 30px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 8px;
            padding: 20px;
        }

        .settings-title {
            font-size: 12px;
            font-weight: 600;
            color: #00ffff;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .setting-group {
            margin-bottom: 15px;
        }

        .setting-group label {
            display: block;
            font-size: 10px;
            color: #888;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .setting-group input,
        .setting-group select {
            width: 100%;
            padding: 8px 10px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 4px;
            color: #00ffff;
            font-size: 12px;
            font-family: inherit;
        }

        .setting-group input:focus,
        .setting-group select:focus {
            outline: none;
            border-color: #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 255, 255, 0.05);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 255, 0.3);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 255, 255, 0.5);
        }

        /* RESPONSIVE */
        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <h1>J.A.R.V.I.S</h1>
            <p>Mission Control Dashboard</p>
        </div>

        <!-- MAIN CONTENT -->
        <div class="main-content">
            <!-- LEFT SIDEBAR -->
            <div class="sidebar">
                <!-- SYSTEM STATUS -->
                <div class="panel">
                    <div class="panel-title">System Status</div>
                    <div class="stat-item">
                        <span class="stat-label">CPU Usage</span>
                        <span class="stat-value">34%</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Memory</span>
                        <span class="stat-value">2.4 GB</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Uptime</span>
                        <span class="stat-value">8h 47m</span>
                    </div>
                </div>

                <!-- AGENTS STATUS -->
                <div class="panel">
                    <div class="panel-title">Active Agents</div>
                    <div style="display: flex; flex-direction: column; gap: 10px;">
                        <div>
                            <span style="display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #00ff88; margin-right: 5px;"></span>
                            <span style="color: #00ffff; font-size: 11px;">Research</span>
                        </div>
                        <div>
                            <span style="display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #00ff88; margin-right: 5px;"></span>
                            <span style="color: #00ffff; font-size: 11px;">Writing</span>
                        </div>
                        <div>
                            <span style="display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #888; margin-right: 5px;"></span>
                            <span style="color: #888; font-size: 11px;">Approval</span>
                        </div>
                        <div>
                            <span style="display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #888; margin-right: 5px;"></span>
                            <span style="color: #888; font-size: 11px;">Posting</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- CENTER - ANIMATED VOICE VISUALIZER -->
            <div class="center-section">
                <div class="voice-visualizer">
                    <div class="sound-circles">
                        <div class="sound-circle"></div>
                        <div class="sound-circle"></div>
                        <div class="sound-circle"></div>
                    </div>
                    <div class="center-circle" id="centerCircle">
                        🎤
                        <div class="status-indicator"></div>
                    </div>
                </div>
                <div class="status-text" id="statusText">Click to speak</div>
            </div>

            <!-- RIGHT PANEL - ACTIVITY FEED -->
            <div class="right-panel">
                <div class="panel-title">System Activity</div>
                <div id="activityFeed" style="flex: 1; overflow-y: auto;">
                    <div class="activity-line"><span class="timestamp">[00:00]</span> System initialized</div>
                    <div class="activity-line"><span class="timestamp">[00:01]</span> All agents online</div>
                    <div class="activity-line"><span class="timestamp">[00:02]</span> Ready for voice input</div>
                </div>
            </div>
        </div>

        <!-- SETTINGS -->
        <div class="settings">
            <div class="settings-title">Configuration</div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="setting-group">
                    <label>Claude API Key</label>
                    <input type="password" id="apiKey" placeholder="sk-...">
                </div>
                <div class="setting-group">
                    <label>Business Niche</label>
                    <input type="text" id="linkedinNiche" placeholder="Your niche" value="Leadership Development, Coaching, AI for Managers">
                </div>
                <div class="setting-group">
                    <label>Posting Frequency</label>
                    <select id="postingFrequency">
                        <option>2x per week (Tuesday, Thursday)</option>
                        <option>3x per week</option>
                        <option>Daily</option>
                        <option>Manual only</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        const synth = window.speechSynthesis;

        let isListening = false;
        const elevenLabsKey = 'sk_5798eb4ca2fa9a76005fcf00d83a71a362313c75ac6a6613';

        recognition.continuous = false;
        recognition.interimResults = true;
        recognition.lang = 'en-US';

        const centerCircle = document.getElementById('centerCircle');
        const statusText = document.getElementById('statusText');
        const activityFeed = document.getElementById('activityFeed');
        const apiKeyInput = document.getElementById('apiKey');
        const nicheInput = document.getElementById('linkedinNiche');

        function addActivity(message, type = 'success') {
            const time = new Date().toLocaleTimeString('en-US', { hour12: false });
            const line = document.createElement('div');
            line.className = `activity-line ${type}`;
            line.innerHTML = `<span class="timestamp">[${time}]</span> ${message}`;
            activityFeed.appendChild(line);
            activityFeed.scrollTop = activityFeed.scrollHeight;
        }

        recognition.onstart = () => {
            isListening = true;
            centerCircle.classList.add('listening');
            statusText.textContent = 'Listening...';
            addActivity('Voice input started', 'success');
        };

        recognition.onresult = (event) => {
            let interimTranscript = '';
            for (let i = event.resultIndex; i < event.results.length; i++) {
                const transcriptSegment = event.results[i][0].transcript;
                if (event.results[i].isFinal) {
                    statusText.textContent = transcriptSegment;
                } else {
                    interimTranscript += transcriptSegment;
                }
            }
            if (interimTranscript) {
                statusText.textContent = interimTranscript;
            }
        };

        recognition.onend = async () => {
            isListening = false;
            centerCircle.classList.remove('listening');
            centerCircle.classList.add('speaking');
            statusText.textContent = 'Processing...';
            const userInput = statusText.textContent;
            if (userInput.trim() && userInput !== 'Processing...') {
                addActivity(`User: "${userInput}"`, 'success');
                await processUserInput(userInput);
            }
            setTimeout(() => {
                centerCircle.classList.remove('speaking');
                statusText.textContent = 'Click to speak';
            }, 2000);
        };

        recognition.onerror = (event) => {
            statusText.textContent = `Error: ${event.error}`;
            centerCircle.classList.remove('listening');
            addActivity(`Error: ${event.error}`, 'error');
        };

        centerCircle.addEventListener('click', () => {
            if (isListening) {
                recognition.stop();
            } else {
                statusText.textContent = '';
                recognition.start();
            }
        });

        async function speakAsJarvis(text) {
            console.log('='.repeat(50));
            console.log('JARVIS VOICE SYSTEM - DEBUG MODE');
            console.log('='.repeat(50));
            console.log('Text:', text);
            console.log('Voice ID:', 'Sq93GQT4X1lKDXsQcixO');
            console.log('ElevenLabs Key Present:', !!elevenLabsKey);
            console.log('ElevenLabs Key Length:', elevenLabsKey ? elevenLabsKey.length : 0);

            if (elevenLabsKey && elevenLabsKey.length > 0) {
                try {
                    console.log('Attempting ElevenLabs API call...');
                    console.log('URL: https://api.elevenlabs.io/v1/text-to-speech/Sq93GQT4X1lKDXsQcixO');

                    const response = await fetch('https://api.elevenlabs.io/v1/text-to-speech/Sq93GQT4X1lKDXsQcixO', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'xi-api-key': elevenLabsKey
                        },
                        body: JSON.stringify({ text: text })
                    });

                    console.log('Response received!');
                    console.log('Status:', response.status);
                    console.log('Status Text:', response.statusText);
                    console.log('Headers:', {
                        'content-type': response.headers.get('content-type'),
                        'content-length': response.headers.get('content-length')
                    });

                    if (response.ok) {
                        const audioBlob = await response.blob();
                        console.log('Audio blob size:', audioBlob.size, 'bytes');
                        console.log('Audio blob type:', audioBlob.type);

                        const audioUrl = URL.createObjectURL(audioBlob);
                        const audio = new Audio(audioUrl);
                        audio.play();

                        console.log('✓ SUCCESS: ElevenLabs audio playing!');
                        addActivity('✓ Playing ElevenLabs voice (Sq93GQT4X1lKDXsQcixO)', 'success');
                        return;
                    } else {
                        const errorBody = await response.text();
                        console.error('✗ ElevenLabs API Error');
                        console.error('Status:', response.status);
                        console.error('Response:', errorBody);
                        addActivity(`✗ ElevenLabs Error ${response.status}: ${errorBody}`, 'error');
                    }
                } catch (error) {
                    console.error('✗ Fetch Error:', error.name, error.message);
                    console.error('Stack:', error.stack);
                    addActivity(`✗ Network Error: ${error.message}`, 'error');
                }
            } else {
                console.warn('⚠ No ElevenLabs key provided');
            }

            // Fallback to browser TTS
            console.log('Falling back to browser speech synthesis...');
            addActivity('Fallback: Using browser voice', 'warning');

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.75;
            utterance.pitch = 0.6;
            utterance.volume = 1.0;

            const voices = synth.getVoices();
            console.log('Available voices:', voices.length);
            voices.forEach((v, i) => {
                console.log(`  ${i}: ${v.name} (${v.lang})`);
            });

            const britishVoice = voices.find(voice => voice.lang.startsWith('en-GB')) || voices[0];
            console.log('Selected voice:', britishVoice.name, britishVoice.lang);

            utterance.voice = britishVoice;
            synth.speak(utterance);
            console.log('Browser voice playing');
            console.log('='.repeat(50));
        }

        async function processUserInput(input) {
            const apiKey = apiKeyInput.value;

            if (!apiKey) {
                speakAsJarvis("I need your Claude API key configured.");
                addActivity('API key required', 'warning');
                return;
            }

            addActivity('Initiating workflow...', 'success');
            await new Promise(resolve => setTimeout(resolve, 1000));
            addActivity('Research agent active', 'success');
            await new Promise(resolve => setTimeout(resolve, 1500));
            addActivity('Content generated', 'success');
            await new Promise(resolve => setTimeout(resolve, 500));

            speakAsJarvis("I've analyzed your content and generated posts ready for review.");
        }

        window.addEventListener('load', () => {
            setTimeout(() => {
                speakAsJarvis("Mission control online. Ready to assist.");
                addActivity('JARVIS initialized', 'success');
            }, 500);
        });

        synth.onvoiceschanged = () => {
            synth.getVoices();
        };
    </script>
</body>
</html>
